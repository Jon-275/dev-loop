# The "Council review" status, shared by every project that uses devloop: pending on a
# pull request's head while its tier needs a council review (council.require_status) and
# none has been reported for that head, success where none is required. A maintainer
# posts the council's own verdict with `devloop council report --post --report <file>`;
# this workflow never overwrites that verdict on the same head. See docs/council.md.
#
# Call it on every push to a pull request, so a new head never keeps an old verdict:
#
#   on:
#     pull_request_target: { types: [opened, synchronize, reopened, ready_for_review] }
#   jobs:
#     council:
#       uses: Jon-275/dev-loop/.github/workflows/council.yml@<tag>
#       permissions: { contents: read, pull-requests: read, statuses: write }
#       with: { devloop: "git+https://github.com/Jon-275/dev-loop@<tag>" }
#
# devloop, devloop.toml and the role cards come from the default branch's checkout,
# never the pull request's; the head and its changed files are read from GitHub. The job
# holds no secret and writes one commit status. A read that fails posts nothing.
#
# A status belongs to a commit, not to a pull request: devloop posts nothing for a fork's
# pull request whose head is also the head of a branch in this repository, so it cannot
# replace that branch's status (docs/security.md). No shell step here posts a status.
name: Council review

on:
  workflow_call:
    inputs:
      devloop:
        description: Where to install devloop from (a uv requirement, or . in dev-loop itself)
        required: true
        type: string

permissions:
  contents: read

jobs:
  council:
    name: Council review run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    concurrency:
      group: devloop-council-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out the default branch (the code, settings and role cards that run)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
          python-version: "3.12.14"
          enable-cache: false

      - name: Install devloop
        env:
          DEVLOOP: ${{ inputs.devloop }}
        run: uv tool install "$DEVLOOP"

      - name: Post the Council review status for the head
        # Exit 1 (pending or a kept failure) is a status, not a broken run.
        run: |
          case "$PR_NUMBER" in
            ''|*[!0-9]*) echo "::error title=Council review::PR_NUMBER must be a number"; exit 1 ;;
          esac
          set +e
          devloop council report --post --pr "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --run-url "$RUN_URL"
          code=$?
          [ "$code" -le 1 ] || exit "$code"
