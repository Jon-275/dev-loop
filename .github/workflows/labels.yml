# The "Review labels" status, shared by every project that uses devloop: every review
# finding on the pull request has a member's reply starting with a label word
# (labels.prefixes, such as "accepted:" or "rejected:"). See `devloop labels`.
#
# Call it from a workflow that runs whenever the answer can change, for example:
#
#   on:
#     pull_request_target: { types: [opened, synchronize, reopened, ready_for_review] }
#     pull_request_review: { types: [submitted, edited, dismissed] }
#     pull_request_review_comment: { types: [created, edited, deleted] }
#   jobs:
#     labels:
#       uses: Jon-275/dev-loop/.github/workflows/labels.yml@<tag>
#       permissions: { checks: read, contents: read, pull-requests: read, statuses: write }
#       with: { devloop: "git+https://github.com/Jon-275/dev-loop@<tag>" }
#
# and as a job that `needs` the review jobs, so their threads are read once posted.
#
# The verdict is the commit status. This job succeeds whenever it posted one, pass or
# fail, and is red only when it could not check, so a red job always needs a look.
#
# The head is marked pending before anything can fail, and a run that fails before
# devloop posts its verdict posts a failure, so an earlier success never outlives a run
# that could not check. devloop and devloop.toml come from the default branch's
# checkout, never the pull request's; the job reads threads, statuses and check runs and
# writes one commit status.
name: Review labels

on:
  workflow_call:
    inputs:
      devloop:
        description: Where to install devloop from (a uv requirement, or . in dev-loop itself)
        required: true
        type: string
      pr:
        description: The pull request number, when the event does not name one
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  labels:
    name: Review labels run
    # A bot's review arrives as one review event and one comment event per finding. The
    # review event starts the check; a run for each of its comments would be the same
    # check many times over. A person's reply is one comment event and always runs.
    if: >-
      github.event_name != 'pull_request_review_comment'
      || github.event.sender.type != 'Bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
      pull-requests: read
      statuses: write
    # No concurrency group: every reply and review starts a run, and cancelling the older
    # ones left a row of cancelled jobs on each commit. Runs may overlap instead; each
    # reads the threads last and reads again after posting (see `devloop labels`). A run
    # that breaks can still post "could not run" after a newer run's verdict; that is a
    # failure with a red job beside it, never a pass that should not stand.
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Mark the head pending before anything can fail
        id: head
        run: |
          case "$PR_NUMBER" in
            ''|*[!0-9]*) echo "::error title=Review labels::PR_NUMBER must be a number"; exit 1 ;;
          esac
          sha="$HEAD_SHA"
          if [ -z "$sha" ]; then
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${sha}" -f state=pending \
            -f "context=Review labels" -f "description=Checking the review threads for labels" \
            -f "target_url=${RUN_URL}"

      - name: Check out the default branch (the code and settings that run)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
          python-version: "3.12.14"
          enable-cache: false

      - name: Install devloop
        env:
          DEVLOOP: ${{ inputs.devloop }}
        run: uv tool install "$DEVLOOP"

      - name: Check every finding thread for a label
        id: check
        timeout-minutes: 5 # a hung step fails, so the step below still reports it
        run: devloop labels

      - name: Report a run that posted no verdict
        # devloop writes posted=true once it has posted a status (its verdict, or the
        # failure it posts when it cannot read GitHub), and sha, the head it marked. A run
        # that broke before that, in setup or in devloop, is reported on that head here.
        if: >-
          failure() && steps.check.outputs.posted != 'true'
          && (steps.check.outputs.sha != '' || steps.head.outputs.sha != '')
        env:
          SHA: ${{ steps.check.outputs.sha || steps.head.outputs.sha }}
        run: >-
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=failure
          -f "context=Review labels" -f "description=The labels check could not run; re-run it"
          -f "target_url=${RUN_URL}"
