# dev-loop's own model reviews, through its shared review.yml. pull_request_target runs
# the base branch's copy of this file and of review.yml, and devloop is installed from
# the base branch's checkout (devloop: "."), so a pull request never runs with the keys.
#
# This repository is public, and the reviews keep the default gate (members): a pull request from
# anyone but the owner, a member, a collaborator or Dependabot is sent to no reviewer
# until a maintainer has looked at it and added the label ai-review-approved. The label
# covers one head: a push removes it (the unapprove job), so new commits wait again.
name: Model reviews

'on':
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

jobs:
  # A new head has not been looked at: the approval given to the last one goes.
  unapprove:
    uses: ./.github/workflows/unapprove.yml
    permissions:
      contents: read
      pull-requests: write

  gemini:
    uses: ./.github/workflows/review.yml
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    with:
      provider: gemini
      devloop: "."
    secrets:
      api_key: ${{ secrets.GEMINI_API_KEY }}

  reflection:
    uses: ./.github/workflows/review.yml
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    with:
      provider: reflection
      devloop: "."
    secrets:
      api_key: ${{ secrets.REFLECTION_API_KEY }}

  # After the reviews, so their threads are read. Replies are checked by labels-replies.yml.
  labels:
    needs: [gemini, reflection]
    if: always()
    uses: ./.github/workflows/labels.yml
    permissions:
      checks: read
      contents: read
      pull-requests: read
      statuses: write
    with:
      devloop: "."

  # Last, so it reads the newest result of everything above (gate.yml, docs/gate.md).
  merge-gate:
    needs: [labels]
    if: always()
    uses: ./.github/workflows/gate.yml
    permissions:
      checks: read
      contents: read
      pull-requests: read
      statuses: write
    with:
      devloop: "."
