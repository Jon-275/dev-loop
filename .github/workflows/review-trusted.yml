# dev-loop's own model reviews, through its shared review.yml. pull_request_target runs
# the base branch's copy of this file and of review.yml, and devloop is installed from
# the base branch's checkout (devloop: "."), so a pull request never runs with the keys.
#
# This repository is public, so the reviews use `gate: members`: a pull request from
# anyone but the owner, a member, a collaborator or Dependabot is sent to no reviewer
# until a maintainer has looked at it and added the label ai-review-approved. The label
# covers one head: a push removes it (the unapprove job), so new commits wait again.
name: Model reviews

'on':
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

jobs:
  # A new head has not been looked at: the approval given to the last one goes. It
  # holds no key and checks out nothing.
  unapprove:
    name: Withdraw approval on a new push
    if: >-
      github.event.action == 'synchronize'
      && contains(github.event.pull_request.labels.*.name, 'ai-review-approved')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Remove the approval label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Two quick pushes both see the label; the second finds it gone, which is the
        # state wanted. Any other failure (permissions, an outage) fails the job.
        run: |
          if ! out="$(gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/ai-review-approved" 2>&1)"; then
            case "$out" in
              *"HTTP 404"*) echo "The label was already removed." ;;
              *) echo "$out" >&2; exit 1 ;;
            esac
          fi

  gemini:
    uses: ./.github/workflows/review.yml
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    with:
      provider: gemini
      devloop: "."
      gate: members
    secrets:
      api_key: ${{ secrets.GEMINI_API_KEY }}

  reflection:
    uses: ./.github/workflows/review.yml
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    with:
      provider: reflection
      devloop: "."
      gate: members
    secrets:
      api_key: ${{ secrets.REFLECTION_API_KEY }}

  # After the reviews, so their threads are read. Replies are checked by labels-replies.yml.
  labels:
    needs: [gemini, reflection]
    if: always()
    uses: ./.github/workflows/labels.yml
    permissions:
      checks: read
      contents: read
      pull-requests: read
      statuses: write
    with:
      devloop: "."
