# dev-loop's "Review labels" check when a thread gets a reply or a review is submitted.
# These events run without the model keys (they are only in review-trusted.yml), and a
# fork's events get a read-only token, so its replies are checked on the next push.
name: Review labels on replies

'on':
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read

jobs:
  labels:
    uses: ./.github/workflows/labels.yml
    permissions:
      checks: read
      contents: read
      pull-requests: read
      statuses: write
    with:
      devloop: "."

  # The merge gate, after the labels check it reads. Not for a bot's per-finding comments
  # (its review event runs it once), and not for a fork's review or reply: that event's
  # token cannot write a status, so the gate judges a fork's pull request on its next push.
  merge-gate:
    needs: [labels]
    if: >-
      always()
      && (github.event_name != 'pull_request_review_comment'
      || github.event.sender.type != 'Bot')
      && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/gate.yml
    permissions:
      checks: read
      contents: read
      pull-requests: read
      statuses: write
    with:
      devloop: "."
