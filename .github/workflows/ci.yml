name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

# Pull request runs replace each other. Each push to main keeps its own run.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/mypy
      - run: .venv/bin/python -m pytest
      - run: .venv/bin/mkdocs build --strict --site-dir "$RUNNER_TEMP/site"

  # dev-loop runs its own shared workflows, installing devloop from this checkout.
  hygiene:
    uses: ./.github/workflows/pr-validation.yml
    permissions:
      contents: read
    with:
      devloop: .

  main-health:
    needs: [check, hygiene]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/main-health.yml
    permissions:
      contents: read
      issues: write
    with:
      devloop: .
      needs: ${{ toJSON(needs) }}
