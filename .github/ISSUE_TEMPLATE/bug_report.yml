name: Bug report
description: Something devloop does wrongly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For a security problem, do not open an issue. See SECURITY.md.
  - type: input
    id: version
    attributes:
      label: devloop version
      description: The release tag or commit your project pins
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: The command or workflow, its output, and the relevant part of devloop.toml. Remove any secret.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
