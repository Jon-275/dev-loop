[project]
name = "dev-loop"
version = "0.1.0"
description = "A standard review and delivery loop across coding agents. Review rules come from one source and are enforced in the CI/CD process."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
devloop = "devloop.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.17,<1",
    "mypy>=2.4,<3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "ANN"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D103"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
